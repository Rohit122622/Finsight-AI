# ──────────────────────────────────────────────────────────────
# FinSentry AI — CI/CD Pipeline
# ──────────────────────────────────────────────────────────────
# Runs on push and pull request to main:
#   1. Lint & type-check frontend
#   2. Run backend unit/integration tests
#   3. Build Docker images (verify Dockerfiles are valid)
# ──────────────────────────────────────────────────────────────

name: FinSentry CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ── Backend Tests ──────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          DATABASE_NAME: finsentry_ci
          JWT_SECRET_KEY: ci-test-secret-key-for-github-actions-do-not-use-in-prod
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_DB: 0
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: finsentry-documents
        run: |
          cd backend
          python -m pytest tests/ -v --tb=short --strict-markers 2>&1

  # ── Frontend Build ─────────────────────────────────────────
  frontend-build:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Lint
        run: |
          cd frontend
          npm run lint 2>&1 || true

      - name: Build
        run: |
          cd frontend
          npm run build

  # ── Docker Build Validation ────────────────────────────────
  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          push: false
          tags: finsentry-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build celery worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/celery.Dockerfile
          push: false
          tags: finsentry-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend.Dockerfile
          push: false
          tags: finsentry-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max