# ──────────────────────────────────────────────────────────────
# FinSentry AI — Development Docker Compose
# ──────────────────────────────────────────────────────────────
# Lightweight dev-mode stack for local development.
# Only runs Redis (other services run locally via npm/uvicorn).
# ──────────────────────────────────────────────────────────────

services:
  finsentry-redis:
    image: redis:7-alpine
    container_name: finsentry-redis
    ports:
      - "6379:6379"
    volumes:
      - finsentry_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - finsentry-net

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      target: production
    container_name: finsentry-backend
    ports:
      - "8000:8000"
    env_file:
      - ../backend/.env
    environment:
      - REDIS_HOST=finsentry-redis
      - REDIS_PORT=6379
      - APP_ENV=development
      - DEBUG=true
    depends_on:
      finsentry-redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finsentry-net

  celery_worker:
    build:
      context: ..
      dockerfile: docker/celery.Dockerfile
      target: production
    container_name: finsentry-celery-worker
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - ../backend/.env
    environment:
      - REDIS_HOST=finsentry-redis
      - REDIS_PORT=6379
      - APP_ENV=development
    depends_on:
      finsentry-redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - finsentry-net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      target: build
    container_name: finsentry-frontend
    ports:
      - "5173:5173"
    command: npm run dev -- --host
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - finsentry-net

volumes:
  finsentry_redis_data:
    name: finsentry_redis_data

networks:
  finsentry-net:
    name: finsentry-net
    driver: bridge