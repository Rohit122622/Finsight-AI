# ──────────────────────────────────────────────────────────────
# FinSentry AI — Nginx API Gateway / Reverse Proxy
# ──────────────────────────────────────────────────────────────
# Production reverse proxy that routes traffic to the appropriate
# backend/frontend services inside the Docker network.
# ──────────────────────────────────────────────────────────────

upstream finsentry_backend {
    server backend:8000;
}

upstream finsentry_frontend {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # ── Security Headers ─────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip ─────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    # ── API Proxy → Backend ──────────────────────────────────
    location /api/ {
        proxy_pass http://finsentry_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running agent tasks
        proxy_read_timeout 600s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
    }

    # ── Frontend SPA ─────────────────────────────────────────
    location / {
        proxy_pass http://finsentry_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
